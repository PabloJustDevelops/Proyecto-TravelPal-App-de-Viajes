<?xml version="1.0" encoding="UTF-8"?>
<svg width="1200" height="400" viewBox="0 0 1200 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Banner App Viajes">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0ea5e9"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>
    <linearGradient id="sunset" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#ef4444"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="8"/>
    </filter>
  </defs>

  <!-- Fondo cielo -->
  <rect x="0" y="0" width="1200" height="400" fill="url(#sky)"/>

  <!-- Sol difuminado -->
  <circle cx="220" cy="120" r="80" fill="url(#sunset)" opacity="0.35" filter="url(#soft)"/>

  <!-- Nubes -->
  <g fill="#ffffff" opacity="0.85">
    <ellipse cx="220" cy="80" rx="110" ry="28"/>
    <ellipse cx="980" cy="90" rx="130" ry="32"/>
    <ellipse cx="720" cy="60" rx="90" ry="22"/>
  </g>

  <!-- Ruta aérea punteada -->
  <path d="M100,280 C300,220 500,320 700,260 S1000,220 1100,300" stroke="#ffffff" stroke-width="3" stroke-dasharray="10 8" fill="none" opacity="0.9"/>

  <!-- Marcadores de destinos -->
  <g>
    <g transform="translate(100,280)">
      <circle r="8" fill="#ffffff"/>
      <circle r="5" fill="#0ea5e9"/>
    </g>
    <g transform="translate(700,260)">
      <circle r="8" fill="#ffffff"/>
      <circle r="5" fill="#0ea5e9"/>
    </g>
    <g transform="translate(1100,300)">
      <circle r="8" fill="#ffffff"/>
      <circle r="5" fill="#0ea5e9"/>
    </g>
  </g>

  <!-- Avión estilizado -->
  <g transform="translate(520,230) rotate(-10)">
    <path d="M0,0 L120,22 L20,28 L15,45 L5,30 L-10,32 Z" fill="#ffffff"/>
    <rect x="15" y="20" width="35" height="6" fill="#22d3ee"/>
    <rect x="65" y="21" width="20" height="5" fill="#22d3ee"/>
  </g>

  <!-- Olas en la parte inferior -->
  <g>
    <path d="M0,340 C120,320 240,360 360,340 C480,320 600,360 720,340 C840,320 960,360 1080,340 C1140,330 1200,340 1200,340 L1200,400 L0,400 Z" fill="#0ea5e9" opacity="0.25"/>
    <path d="M0,360 C140,340 280,380 420,360 C560,340 700,380 840,360 C980,340 1120,380 1200,360 L1200,400 L0,400 Z" fill="#22d3ee" opacity="0.25"/>
  </g>

  <!-- Título y claim -->
  <text x="640" y="120" text-anchor="middle" font-family="system-ui, -apple-system, Segoe UI, Roboto, Ubuntu, Cantarell, Noto Sans, sans-serif" font-size="42" fill="#ffffff" font-weight="700">App Viajes</text>
  <text x="640" y="160" text-anchor="middle" font-family="system-ui, -apple-system, Segoe UI, Roboto, Ubuntu, Cantarell, Noto Sans, sans-serif" font-size="20" fill="#e6f7fb">Planifica, reserva y controla tus viajes</text>
  
  <!-- Píldoras de features -->
  <g font-family="system-ui, -apple-system, Segoe UI, Roboto, Ubuntu, Cantarell, Noto Sans, sans-serif" font-size="16" fill="#083344">
    <rect x="420" y="190" rx="20" ry="20" width="140" height="36" fill="#ffffff" opacity="0.9"/>
    <text x="490" y="214" text-anchor="middle">Itinerarios</text>
    
    <rect x="580" y="190" rx="20" ry="20" width="160" height="36" fill="#ffffff" opacity="0.9"/>
    <text x="660" y="214" text-anchor="middle">Gastos y presupuesto</text>
    
    <rect x="760" y="190" rx="20" ry="20" width="140" height="36" fill="#ffffff" opacity="0.9"/>
    <text x="830" y="214" text-anchor="middle">Analíticas</text>
  </g>
</svg>